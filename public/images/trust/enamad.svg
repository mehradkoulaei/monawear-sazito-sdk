<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="enamad-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F2D6B"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="enamad-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F2D6B" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Main Blue Shield / Badge -->
  <path d="M50 4 C76 4 92 14 92 36 C92 68 50 94 50 94 C50 94 8 68 8 36 C8 14 24 4 50 4 Z" fill="url(#enamad-grad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#enamad-shadow)"/>
  <!-- Inner White Trim -->
  <path d="M50 8 C72 8 86 17 86 36 C86 64 50 88 50 88 C50 88 14 64 14 36 C14 17 28 8 50 8 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- Golden Five-Pointed Star -->
  <path d="M50 16 L52.4 23.4 L60.2 23.4 L53.9 28 L56.3 35.4 L50 30.8 L43.7 35.4 L46.1 28 L39.8 23.4 L47.6 23.4 Z" fill="url(#gold-grad)"/>

  <!-- Enamad Calligraphic Emblem 'e' -->
  <g fill="#FFFFFF" transform="translate(24, 34) scale(1.6)">
    <!-- Swirl and eye of Enamad symbol -->
    <path d="M16 2.5 C11 2.5 7 5.5 6 10 C5 14.5 8 18 13 19 C18 20 22 17 24 13 C24.5 11.5 24 10 22.5 10 C21 10 20 11 19.5 12 C18 15 15 16.5 12 15.5 C9 14.5 7.5 12 8.5 9 C9.5 6 12.5 5 16 5 C19 5 21 6.5 22 8.5 L24.5 7.5 C23 4.5 20 2.5 16 2.5 Z"/>
    <circle cx="16" cy="10.5" r="2.2" fill="url(#gold-grad)"/>
    <!-- Lower decorative base curve -->
    <path d="M9 19.5 C12 21 17 21 21 19 C22 18.5 23 19.5 22 20.5 C17 22.5 11 22.5 7.5 20.5 C6.5 20 7.5 19 9 19.5 Z"/>
  </g>

  <!-- Typography "اینماد" -->
  <text x="50" y="78" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" direction="rtl">ایـنـمـاد</text>
  <text x="50" y="86" font-family="Vazirmatn, Tahoma, sans-serif" font-size="5" font-weight="500" fill="#93C5FD" text-anchor="middle" direction="rtl">اعتماد الکترونیکی</text>
</svg>
