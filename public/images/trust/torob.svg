<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="torob-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#D92222"/>
    </linearGradient>
    <linearGradient id="torob-leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <filter id="torob-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D92222" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="92" height="92" x="4" y="4" rx="22" fill="#FFF5F5" stroke="#FFE0E0" stroke-width="1.5" filter="url(#torob-shadow)"/>
  
  <!-- Torob Green Leaves -->
  <g fill="url(#torob-leaf)" transform="translate(0, 2)">
    <!-- Center leaf -->
    <path d="M50 8 C48 16 48 24 50 30 C52 24 52 16 50 8 Z"/>
    <!-- Left leaf -->
    <path d="M50 26 C43 20 37 17 32 17 C34 22 38 27 48 29 Z"/>
    <!-- Right leaf -->
    <path d="M50 26 C57 20 63 17 68 17 C66 22 62 27 52 29 Z"/>
  </g>

  <!-- Torob Radish Body -->
  <path d="M50 27 C68 27 75 42 70 57 C65 72 54 78 50 80 C46 78 35 72 30 57 C25 42 32 27 50 27 Z" fill="url(#torob-red)"/>
  
  <!-- Radish Highlights & Details -->
  <!-- Cute Eyes -->
  <circle cx="43" cy="46" r="3" fill="#FFFFFF"/>
  <circle cx="44" cy="46" r="1.5" fill="#1A1A1A"/>
  <circle cx="57" cy="46" r="3" fill="#FFFFFF"/>
  <circle cx="56" cy="46" r="1.5" fill="#1A1A1A"/>
  
  <!-- Sweet Smile -->
  <path d="M46 54 Q50 58 54 54" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Cute Cheeks -->
  <circle cx="38" cy="51" r="2" fill="#FFA4A4" opacity="0.6"/>
  <circle cx="62" cy="51" r="2" fill="#FFA4A4" opacity="0.6"/>

  <!-- Typography "تُـرُب" -->
  <text x="50" y="89" font-family="Vazirmatn, Tahoma, sans-serif" font-size="10" font-weight="bold" fill="#D92222" text-anchor="middle" direction="rtl">تُــرُب</text>
</svg>
